name: CI

on:
  push:
    branches: [ main, actions ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
            os: linux
            arch: x86_64
            test: true
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-latest
            os: linux
            arch: aarch64
            test: false
          - target: x86_64-apple-darwin
            runs-on: macos-latest
            os: macos
            arch: x86_64
            test: false
          - target: aarch64-apple-darwin
            runs-on: macos-latest
            os: macos
            arch: aarch64
            test: false
          - target: x86_64-pc-windows-msvc
            runs-on: windows-latest
            os: windows
            arch: x86_64
            test: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenSSL (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo 'export OPENSSL_DIR=$(brew --prefix openssl@3)' >> $GITHUB_ENV

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install openssl:x64-windows
          echo "OPENSSL_DIR=C:/vcpkg/installed/x64-windows" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=C:/vcpkg/installed/x64-windows/lib" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=C:/vcpkg/installed/x64-windows/include" >> $env:GITHUB_ENV

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install dependencies for Linux AArch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build and test
        if: matrix.test
        run: |
          cargo build --verbose
          cargo test --verbose

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary (Unix-like)
        if: matrix.os != 'windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/loadbalancer-rs dist/loadbalancer-rs-${{ matrix.os }}-${{ matrix.arch }}

      - name: Prepare binary (Windows)
        if: matrix.os == 'windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/loadbalancer-rs.exe dist/loadbalancer-rs-${{ matrix.os }}-${{ matrix.arch }}.exe

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: loadbalancer-rs-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/loadbalancer-rs-${{ matrix.os }}-${{ matrix.arch }}*
          if-no-files-found: error